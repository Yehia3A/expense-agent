# Deploys to Cloudflare on every push to main, after the tests pass.
# Pull requests into main run the typecheck and tests only, never a deploy.
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   (template "Edit Cloudflare Workers" + D1 Edit permission)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard → Workers & Pages → right sidebar)
# The secret the Worker itself needs (LLM_API_KEY) is set once with
# `npm run setup:cloudflare` and persist across deploys.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Until the two secrets are added, pushes only run the tests.
      HAS_CLOUDFLARE: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Apply D1 migrations
        if: env.HAS_CLOUDFLARE == 'true'
        run: npx wrangler d1 migrations apply expense_agent --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
